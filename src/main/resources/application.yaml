spring:
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: "mySecretKeyForJWTTokenGenerationAndValidation2024VeryLongKeyThatIsAtLeast32Characters"
    expiration: 900000  # 15 minutes in milliseconds (access token)
    refresh-expiration: 604800000  # 7 days in milliseconds (refresh token)

logging:
  level:
    com.charan.auth: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"